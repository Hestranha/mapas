services:
  # ---------------------------------------------------------------- base de datos
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: nominatim
      POSTGRES_PASSWORD: nominatim
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - work_mem=64MB
      - -c
      - synchronous_commit=off
      - -c
      - max_wal_size=2GB
      - -c
      - random_page_cost=1.0
    shm_size: 2gb
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nominatim -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ------------------------------------------------- import OSM -> Nominatim (1 vez)
  nominatim-import:
    image: mapas-nominatim:5.3.3
    build: ./geocoder/nominatim
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NOMINATIM_DATABASE_DSN: "postgresql://nominatim:nominatim@db:5432/nominatim"
      NOMINATIM_IMPORT_STYLE: "full"
      PBF_FILE: "/data/peru-latest.osm.pbf"
      PBF_URL: "https://download.geofabrik.de/south-america/peru-latest.osm.pbf"
      PGHOST: db
      PGPORT: "5432"
      PGUSER: nominatim
      FORCE_IMPORT: "${FORCE_IMPORT:-0}"
    volumes:
      - ./:/data
      - nominatim-data:/data-env

  # ------------------------------------------------------ import Nominatim -> Photon
  photon-import:
    image: mapas-photon:1.3.0
    build: ./geocoder/photon
    restart: "no"
    command: ["import"]
    depends_on:
      nominatim-import:
        condition: service_completed_successfully
    environment:
      PHOTON_HOST: db
      PHOTON_DB: nominatim
      PHOTON_USER: nominatim
      PHOTON_PASSWORD: nominatim
      FORCE_IMPORT: "${FORCE_IMPORT:-0}"
    volumes:
      - photon-data:/opt/photon/photon_data

  # ---------------------------------------------------- generador tiles vectoriales
  tilemaker:
    image: ghcr.io/systemed/tilemaker:master
    restart: "no"
    depends_on:
      nominatim-import:
        condition: service_completed_successfully
    volumes:
      - ./:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -f /data/data/peru.mbtiles ]; then
          echo "==> /data/data/peru.mbtiles ya existe, omitiendo generacion."
          exit 0
        fi
        echo "==> Generando /data/data/peru.mbtiles con tilemaker..."
        mkdir -p /data/data /data/data/tmp-tilemaker
        PBF=$$(ls /data/*.osm.pbf 2>/dev/null | head -n 1)
        if [ -z "$$PBF" ]; then
          echo "ERROR: No se encontro ningun archivo .osm.pbf en /data" >&2
          exit 1
        fi
        /usr/local/bin/tilemaker \
          --input "$$PBF" \
          --output /data/data/peru.mbtiles \
          --config /data/tilemaker/config-peru.json \
          --process /data/tilemaker/process-openmaptiles.lua \
          --bbox "-83.2,-19.6,-68.0,1.2" \
          --store /data/data/tmp-tilemaker \
          --threads 0 \
          --verbose
        rm -rf /data/data/tmp-tilemaker
        echo "==> /data/data/peru.mbtiles generado exitosamente."

  # -------------------------------------------------------------- geocodificador
  photon:
    image: mapas-photon:1.3.0
    build: ./geocoder/photon
    restart: unless-stopped
    depends_on:
      photon-import:
        condition: service_completed_successfully
    environment:
      PHOTON_LISTEN_PORT: "2322"
    volumes:
      - photon-data:/opt/photon/photon_data
    ports:
      - "2322:2322"

  # ------------------------------------------------------------- servidor de mapa
  tileserver:
    image: mapas-tileserver:1.0.0
    build: ./tileserver
    restart: unless-stopped
    depends_on:
      photon:
        condition: service_started
      tilemaker:
        condition: service_completed_successfully
    environment:
      MBTILES_PATH: /data/peru.mbtiles
      PHOTON_URL: http://photon:2322
      PORT: "8080"
    volumes:
      - ./data:/data:ro
    ports:
      - "8080:8080"

volumes:
  dbdata:
  nominatim-data:
  photon-data:
